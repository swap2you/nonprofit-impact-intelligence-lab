services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: impact_lab
      POSTGRES_USER: impact
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impact -d impact_lab"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
